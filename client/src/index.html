<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/quicksand@5.1.0/files/quicksand-latin-wght-normal.woff2" />
    <link rel="stylesheet" href="/styles/fonts.css" />
    <title>Insights | Suit Tracker</title>
    <meta name="description"
      content="Capture brand observations and turn good insights into great next moves with Suit Tracker." />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
    try {
      const theme = localStorage.getItem("suit-tracker-theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
